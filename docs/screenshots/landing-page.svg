<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#041827"/>
      <stop offset="0.52" stop-color="#071d32"/>
      <stop offset="1" stop-color="#0b2f44"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 180) rotate(90) scale(420 900)">
      <stop stop-color="#1fe0c0" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#1fe0c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8AF7E6"/>
      <stop offset="1" stop-color="#62D6C9"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#glow)"/>
  <circle cx="1180" cy="760" r="210" fill="#20c2d4" opacity="0.15"/>
  <rect x="90" y="50" width="1220" height="800" rx="24" fill="#071b2d" opacity="0.28" stroke="#2aa6a6" stroke-opacity="0.28"/>

  <g opacity="0.9">
    <circle cx="120" cy="126" r="18" fill="#0d2539" stroke="#42d2bc"/>
    <circle cx="120" cy="126" r="7" fill="#52e9d4"/>
    <text x="160" y="132" fill="#D9EEE7" font-family="Georgia, serif" font-size="20" letter-spacing="3">THE LOST CODE KINGDOM</text>
    <text x="179" y="157" fill="#9FBDCB" font-family="Georgia, serif" font-size="14" letter-spacing="2">A magical Python adventure</text>
  </g>

  <g>
    <rect x="910" y="80" width="110" height="42" rx="21" fill="#0d2434" stroke="#2bb7a6"/>
    <circle cx="940" cy="101" r="7" fill="#57e7d8"/>
    <text x="953" y="109" fill="#E6F5F2" font-family="Segoe UI, sans-serif" font-size="18">Guest Hero</text>

    <rect x="1060" y="80" width="140" height="42" rx="21" fill="#0d2434" stroke="#2bb7a6"/>
    <text x="1110" y="108" fill="#E5F7F3" font-family="Segoe UI, sans-serif" font-size="18">World Map</text>

    <rect x="1218" y="80" width="140" height="42" rx="21" fill="#6fead1"/>
    <text x="1259" y="108" fill="#081c27" font-family="Segoe UI, sans-serif" font-size="18">Start Quest</text>
  </g>

  <g>
    <text x="110" y="240" fill="#83d4c7" font-family="Georgia, serif" font-size="85" font-weight="700">The Lost Code</text>
    <text x="110" y="334" fill="#83d4c7" font-family="Georgia, serif" font-size="90" font-weight="700">Kingdom</text>
    <text x="112" y="390" fill="#8ED8CF" font-family="Segoe UI, sans-serif" font-size="26" letter-spacing="7">A FANTASY PYTHON ADVENTURE</text>
    <text x="112" y="468" fill="#E4F1F0" font-family="Georgia, serif" font-size="30">A magical world has been corrupted by broken code.</text>
    <text x="112" y="510" fill="#E4F1F0" font-family="Georgia, serif" font-size="30">Restore each realm, solve real Python puzzles, and bring the</text>
    <text x="112" y="552" fill="#E4F1F0" font-family="Georgia, serif" font-size="30">codebook back to life.</text>
  </g>

  <g>
    <rect x="930" y="240" width="350" height="280" rx="26" fill="#0c2436" stroke="#48d0be" stroke-opacity="0.8"/>
    <rect x="960" y="272" width="120" height="120" rx="18" fill="#8fe7d9" opacity="0.2"/>
    <rect x="981" y="295" width="78" height="76" rx="18" fill="#64d5c8"/>
    <circle cx="1019" cy="335" r="18" fill="#0c2436"/>
    <text x="1100" y="305" fill="#E6FCF7" font-family="Segoe UI, sans-serif" font-size="20">Pip says</text>
    <text x="1100" y="342" fill="#E6FCF7" font-family="Georgia, serif" font-size="34">Hint</text>
    <text x="1100" y="408" fill="#D8EEF1" font-family="Georgia, serif" font-size="26">Pip the Python</text>
    <text x="1100" y="447" fill="#C9DEE5" font-family="Segoe UI, sans-serif" font-size="22">The first puzzles teach</text>
    <text x="1100" y="477" fill="#C9DEE5" font-family="Segoe UI, sans-serif" font-size="22">you the language. The</text>
    <text x="1100" y="507" fill="#C9DEE5" font-family="Segoe UI, sans-serif" font-size="22">later ones ask you to</text>
    <text x="1100" y="537" fill="#C9DEE5" font-family="Segoe UI, sans-serif" font-size="22">trace, compare, and</text>
    <text x="1100" y="567" fill="#C9DEE5" font-family="Segoe UI, sans-serif" font-size="22">predict the magic.</text>
  </g>

  <g>
    <rect x="110" y="620" width="1180" height="130" rx="20" fill="#0a1d2e" stroke="#3fc0b3" stroke-opacity="0.28"/>
    <text x="160" y="680" fill="#9BDFD3" font-family="Segoe UI, sans-serif" font-size="26" letter-spacing="5">CHOOSE YOUR PATH</text>
    <rect x="420" y="640" width="160" height="60" rx="14" fill="#0d2434" stroke="#2bb7a6"/>
    <text x="472" y="679" fill="#EAF8F5" font-family="Segoe UI, sans-serif" font-size="20">Chapter 1</text>
    <rect x="610" y="640" width="160" height="60" rx="14" fill="#0d2434" stroke="#2bb7a6"/>
    <text x="670" y="679" fill="#EAF8F5" font-family="Segoe UI, sans-serif" font-size="20">Chapter 2</text>
    <rect x="800" y="640" width="160" height="60" rx="14" fill="#0d2434" stroke="#2bb7a6"/>
    <text x="864" y="679" fill="#EAF8F5" font-family="Segoe UI, sans-serif" font-size="20">Chapter 3</text>
    <rect x="990" y="640" width="160" height="60" rx="14" fill="#0d2434" stroke="#2bb7a6"/>
    <text x="1050" y="679" fill="#EAF8F5" font-family="Segoe UI, sans-serif" font-size="20">Chapter 4</text>
  </g>
</svg>
