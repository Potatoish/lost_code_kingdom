<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#051b2f"/>
      <stop offset="0.5" stop-color="#071b2d"/>
      <stop offset="1" stop-color="#122d3d"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#bg3)"/>

  <g>
    <text x="110" y="120" fill="#7AE2D0" font-family="Georgia, serif" font-size="58">Play Area</text>
    <text x="110" y="180" fill="#D4E7EC" font-family="Georgia, serif" font-size="30">Solve the chapter puzzles to restore this realm.</text>
    <rect x="1030" y="110" width="210" height="44" rx="22" fill="#0f2940" stroke="#43d1ba"/>
    <text x="1075" y="139" fill="#DAF5F0" font-family="Segoe UI, sans-serif" font-size="18">5 escalating puzzles</text>
  </g>

  <g>
    <text x="110" y="250" fill="#DDECF0" font-family="Segoe UI, sans-serif" font-size="22">Puzzle 1 of 5</text>
    <text x="390" y="250" fill="#DDECF0" font-family="Segoe UI, sans-serif" font-size="22">Progress: 0 of 5 solved</text>
    <text x="690" y="250" fill="#DDECF0" font-family="Segoe UI, sans-serif" font-size="22">Spell Lab: Required</text>
    <text x="980" y="250" fill="#DDECF0" font-family="Segoe UI, sans-serif" font-size="22">Chapter Flow: 0 of 6 objectives cleared</text>
  </g>

  <g>
    <rect x="110" y="300" width="180" height="90" rx="18" fill="#61e6d4"/>
    <text x="175" y="336" fill="#041829" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">1</text>
    <text x="155" y="363" fill="#041829" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">NOW</text>

    <rect x="320" y="300" width="180" height="90" rx="18" fill="#11263a" stroke="#47c6b5" stroke-opacity="0.5"/>
    <text x="385" y="336" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="22">2</text>
    <text x="350" y="363" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="16">PUZZLE</text>

    <rect x="530" y="300" width="180" height="90" rx="18" fill="#11263a" stroke="#47c6b5" stroke-opacity="0.5"/>
    <text x="595" y="336" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="22">3</text>
    <text x="560" y="363" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="16">PUZZLE</text>

    <rect x="740" y="300" width="180" height="90" rx="18" fill="#11263a" stroke="#47c6b5" stroke-opacity="0.5"/>
    <text x="805" y="336" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="22">4</text>
    <text x="770" y="363" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="16">PUZZLE</text>

    <rect x="950" y="300" width="180" height="90" rx="18" fill="#11263a" stroke="#47c6b5" stroke-opacity="0.5"/>
    <text x="1015" y="336" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="22">5</text>
    <text x="980" y="363" fill="#E3F7F4" font-family="Segoe UI, sans-serif" font-size="16">PUZZLE</text>
  </g>

  <g>
    <rect x="110" y="430" width="1175" height="320" rx="22" fill="#0d2133" stroke="#3aaea0" stroke-opacity="0.45"/>
    <text x="150" y="500" fill="#EAF3F1" font-family="Georgia, serif" font-size="50">Puzzle 1: Whispered Output</text>
    <rect x="152" y="540" width="620" height="120" rx="18" fill="#0a1b29" stroke="#42bca8" stroke-opacity="0.4"/>
    <text x="185" y="600" fill="#E8F4F8" font-family="Consolas, monospace" font-size="30">spirit_name = 'Liora'</text>
    <text x="185" y="640" fill="#E8F4F8" font-family="Consolas, monospace" font-size="30">print(spirit_name)</text>

    <rect x="835" y="540" width="390" height="170" rx="18" fill="#0a1b29" stroke="#42bca8" stroke-opacity="0.4"/>
    <text x="875" y="588" fill="#D4E9F0" font-family="Segoe UI, sans-serif" font-size="20" letter-spacing="4">ANSWER CONSOLE</text>
    <text x="910" y="650" fill="#E9F5F3" font-family="Georgia, serif" font-size="38">Liora</text>
    <text x="910" y="700" fill="#E9F5F3" font-family="Georgia, serif" font-size="38">Lumenwood</text>
    <text x="910" y="750" fill="#E9F5F3" font-family="Georgia, serif" font-size="38">spirit_name</text>
  </g>

  <g>
    <rect x="110" y="770" width="1175" height="90" rx="18" fill="#0d2436" stroke="#429f9d" stroke-opacity="0.35"/>
    <rect x="178" y="790" width="110" height="50" rx="12" fill="#3ad7c8" opacity="0.32"/>
    <text x="195" y="823" fill="#A5E7DB" font-family="Segoe UI, sans-serif" font-size="20">Pip says</text>
    <text x="310" y="824" fill="#D9EEF3" font-family="Georgia, serif" font-size="30">Hint</text>
    <text x="390" y="823" fill="#E3F4F3" font-family="Georgia, serif" font-size="30">Pip Is Ready</text>
  </g>
